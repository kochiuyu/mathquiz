<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade coverage | MathQuiz</title><link rel="stylesheet" href="quiz.css?v=21">
<body><header><strong>MathQuiz</strong><nav aria-label="Language"><a id="en" href="coverage.html?lang=en">English</a> · <a id="zh" href="coverage.html?lang=zh" lang="zh-HK">繁體中文</a></nav></header><main id="coverage"></main>
<script src="questions.js?v=4"></script><script src="builder.js?v=16"></script>
<script>
(() => {
  const lang=new URLSearchParams(location.search).get("lang")==="zh"?1:0;
  document.documentElement.lang=lang?"zh-HK":"en";
  const t=(en,zh)=>lang?zh:en;
  const planned={
    1:["Explain why a rotated shape is a triangle","解釋旋轉後的圖形為何仍是三角形"],
    2:["Explain what a pictogram symbol represents","解釋象形圖中一個圖案代表甚麼"],
    3:["Compare shaded fractions using equal-sized wholes","比較相同大小整體的塗色分數"],
    4:["Find a missing rectangle side from its perimeter","根據長方形周界找出未知邊長"],
    5:["Translate a purchase story into an equation","把購物情境寫成方程"],
    6:["Convert minutes to hours before finding speed","先把分鐘化為小時，再計算速率"]
  };
  const types={add1:"apply",next1:"identify",count20a:"identify",parts18a:"calculate",pictureadd1:"represent",storyadd1:"apply",otherway1:"represent",triangle1:"identify",place3a:"identify",groups2a:"represent",pict2a:"identify",share2a:"calculate",frac3a:"represent",cup3a:"identify",bar3a:"identify",per1:"calculate",factor1:"identify",bar4a:"identify",fracadd5a:"calculate",equation5a:"calculate",triarea5a:"calculate",volume5a:"calculate",circle5a:"identify",pct2:"calculate",mean1:"calculate"};
  const live=families.filter(f=>!f.retired);
  const escaped=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const cards=[1,2,3,4,5,6].map(grade=>{
    const set=live.filter(f=>f.grade===grade),units=new Set(set.map(f=>f.code)),forms=new Set(set.map(f=>types[f.id]||"other"));
    const rows=set.map(f=>'<li><a href="./?v=3&lang='+(lang?"zh":"en")+'&p='+grade+'&items='+f.id+'-0&view=build">'+escaped(f.label[lang])+'</a> <small>('+f.code+' · '+f.count+' '+t("variants","個版本")+' · '+escaped(types[f.id]||"other")+')</small></li>').join("");
    return '<section class="card" style="display:block;margin:20px 0"><h2>'+t("Primary ","小學")+grade+'</h2><p>'+set.length+' '+t("live task families","個已上線題目系列")+' · '+units.size+' '+t("units touched","個涉及單元")+' · '+forms.size+' '+t(forms.size===1?"task type":"task types","種題目類型")+'</p><ul>'+rows+'</ul><p><b>'+t("Planned example: ","計劃中的例子：")+'</b>'+escaped(planned[grade][lang])+'</p></section>';
  }).join("");
  document.getElementById("coverage").innerHTML='<a href="./?lang='+(lang?"zh":"en")+'">← '+t("All quizzes","所有小測")+'</a><h1>'+t("Grade coverage","各年級題目涵蓋範圍")+'</h1><p>'+t("These are released question families, not complete coverage of any EDB unit. A unit count shows where at least one task is live; the linked curriculum map records the precise reviewed objectives. Planned examples are not live.","以下列出已上線的題目系列，並不代表已涵蓋教育局任何單元的全部內容。單元數量表示至少有一道題目已上線；課程對照表記錄已核對的具體目標。計劃中的例子尚未上線。")+'</p><p><a href="planning/primary-mathematics.md">'+t("Curriculum and objective map","課程及學習目標對照表")+'</a> · <a href="planning/live-family-audit.md">'+t("Live family audit","已上線題目系列記錄")+'</a></p>'+cards;
})();
</script></body></html>
