<!doctype html>

<body><header><strong>MathQuiz</strong><nav aria-label="Language"><a id="en" href="coverage.html?lang=en">English</a> · <a id="zh" href="coverage.html?lang=zh" lang="zh-HK">繁體中文</a></nav></header><main id="coverage"></main>
<script src="questions.js?v=4"></script><script src="builder.js?v=36"></script>
<script>
(() => {
  const lang=new URLSearchParams(location.search).get("lang")==="zh"?1:0;
  document.documentElement.lang=lang?"zh-HK":"en";
  const t=(en,zh)=>lang?zh:en;
  const planned={
    1:["More digital practice for five flat-shape types","五類平面圖形的更多網上練習"],
    2:["Explain what a pictogram symbol represents","解釋象形圖中一個圖案代表甚麼"],
    3:["Compare shaded fractions using equal-sized wholes","比較相同大小整體的塗色分數"],
    4:["Find all factors of a number","找出一個數的所有因數"],
    5:["Compare groups in a compound bar chart","比較複合棒形圖中的不同組別"],
    6:["Read a travel graph to find speed","從行程圖讀取速率"]
  };
const types={add1:"apply",next1:"identify",count20a:"identify",parts18a:"calculate",pictureadd1:"represent",storyadd1:"apply",otherway1:"represent",triangle1:"identify",compare100a:"identify",tensones1a:"represent",countgroups1a:"identify",sequence100a:"identify",oddeven100a:"identify",ordernums100a:"represent",numberwords100a:"represent",estimate100a:"estimate",carryadd1a:"calculate",noborrow1a:"calculate",checksub1a:"identify",threeadd1a:"calculate",groupadd1a:"represent",group10p1a:"represent",columnadd1a:"calculate",columnsub1a:"calculate",storyadd1a:"apply",storysub1a:"apply",lengthdirect1a:"identify",distancedirect1a:"identify",lengthunits1a:"identify",distanceunits1a:"identify",place3a:"identify",groups2a:"represent",pict2a:"identify",share2a:"calculate",frac3a:"represent",cup3a:"identify",bar3a:"identify",per1:"calculate",permissing4a:"calculate",factor1:"identify",factorpair4a:"represent",bar4a:"identify",fracadd5a:"calculate",equation5a:"calculate",purchasestory5a:"represent",triarea5a:"calculate",volume5a:"calculate",circle5a:"identify",pct2:"calculate",speed6a:"calculate",mean1:"calculate"};
  Object.assign(types,{digitvalue2a:"identify",sequence999a:"identify",parity999a:"identify",compare999a:"represent",order999a:"represent",addcarry2a:"calculate",smartadd2a:"represent",subborrow2a:"calculate",subchain2a:"calculate",addstory2a:"apply",substory2a:"apply",multfact2a:"calculate",multstory2a:"apply",solidname1a:"identify",coinvalue1a:"identify",priceword1a:"identify",coincount1a:"calculate",lengthcm1a:"calculate",distancecm1a:"calculate",comparelengthcm1a:"identify",comparedistancecm1a:"identify"});
  const typeNames={apply:"應用",identify:"辨認",calculate:"計算",represent:"表示",estimate:"估計",other:"其他"};
  const live=families.filter(f=>!f.retired);
  const escaped=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const cards=[1,2,3,4,5,6].map(grade=>{
    const set=live.filter(f=>f.grade===grade),units=new Set(set.map(f=>f.code)),forms=new Set(set.map(f=>types[f.id]||"other"));
    const rows=set.map(f=>'<li><a href="./?v=3&lang='+(lang?"zh":"en")+'&p='+grade+'&items='+f.id+'-0&view=build">'+escaped(f.label[lang])+'</a> <small>('+f.code+' · '+f.count+' '+t("variants","個版本")+' · '+escaped(lang?typeNames[types[f.id]||"other"]:types[f.id]||"other")+')</small></li>').join("");
    const activities=grade===1?'<p><a href="activities/p1-early-number-review.html?lang='+(lang?'zh':'en')+'">'+t('Early-number and operations assessment (1N1–1N2)','初步數字及運算評估（1N1–1N2）')+'</a> · <a href="activities/p1-time.html?lang='+(lang?'zh':'en')+'">'+t('Clocks, calendar and real-time observation (1M4)','時鐘、月曆及實際時間觀察（1M4）')+'</a> · <a href="activities/p1-number-sense-review.html?lang='+(lang?'zh':'en')+'">'+t('Number-sense review (1N3)','數感評估（1N3）')+'</a> · <a href="activities/p1-money.html?lang='+(lang?'zh':'en')+'">'+t('Real-coin assessment (1M2)','真實硬幣評估（1M2）')+'</a> · <a href="activities/p1-numbers-oral.html?lang='+(lang?'zh':'en')+'">'+t('Oral and listening number assessment (1N3)','口述和聆聽數字評估（1N3）')+'</a> · <a href="activities/p1-addition-subtraction-review.html?lang='+(lang?'zh':'en')+'">'+t('Addition and subtraction review (1N4)','加減法評估（1N4）')+'</a> · <a href="activities/p1-length-distance-i.html?lang='+(lang?'zh':'en')+'">'+t('Teacher-led informal measurement activity (1M1)','教師帶領的自訂單位量度活動（1M1）')+'</a> · <a href="activities/p1-length-distance-ii.html?lang='+(lang?'zh':'en')+'">'+t('Teacher-led centimetre activity (1M3)','教師帶領的厘米活動（1M3）')+'</a> · <a href="activities/p1-3d-shapes.html?lang='+(lang?'zh':'en')+'">'+t('Real-solid exploration (1S1)','實物立體探索（1S1）')+'</a> · <a href="activities/p1-2d-shapes.html?lang='+(lang?'zh':'en')+'">'+t('Draw and make flat shapes (1S2)','畫及製作平面圖形（1S2）')+'</a> · <a href="activities/p1-directions.html?lang='+(lang?'zh':'en')+'">'+t('Describe positions (1S3)','描述位置（1S3）')+'</a> · <a href="activities/p1-inquiry.html?lang='+(lang?'zh':'en')+'">'+t('Investigate and explain (1F1)','探究及解釋（1F1）')+'</a></p>':grade===2?'<p><a href="activities/p2-3digit-numbers.html?lang='+(lang?'zh':'en')+'">'+t('Three-digit number observation (2N1)','三位數觀察活動（2N1）')+'</a> · <a href="activities/p2-addition-subtraction-ii.html?lang='+(lang?'zh':'en')+'">'+t('Calculation, strategy and explanation (2N2)','計算、策略及解釋（2N2）')+'</a> · <a href="activities/p2-basic-multiplication.html?lang='+(lang?'zh':'en')+'">'+t('Groups, tables and multiplication (2N3)','分組、乘法表及乘法（2N3）')+'</a></p><p>'+t('P2 additions are release candidates, not verified-complete units. Numeric answers do not certify oral explanations, genuine estimation or whole-table recall.','小二新增內容屬待驗證版本，並非已完成單元。數字答案不能證明口述解釋、真正估計或整張乘法表的記憶。')+'</p>':'';
    return '<section class="card" style="display:block;margin:20px 0"><h2>'+t("Primary "+grade,"小"+["一","二","三","四","五","六"][grade-1])+'</h2><p>'+set.length+' '+t("live task families","個已上線題目系列")+' · '+units.size+' '+t("units touched","個涉及單元")+' · '+forms.size+' '+t(forms.size===1?"task type":"task types","種題目類型")+'</p><ul>'+rows+'</ul>'+activities+(grade===1?'<p>'+t('All 12 P1 units have linked resources; 9 have selectable digital tasks. Time, directions and inquiry are teacher-led. All 12 are source-reviewed resource complete (live185/185); classroom and manual print/accessibility validation remain separate.','小一12個單元均有連結資源，9個有可選網上題目。時間、方向及探究由教師帶領，全部12個已通過資源完成核實（網上185/185項檢查）；課堂、人工列印及無障礙驗證另行處理。')+'</p>':'')+'<p><b>'+t("Planned example: ","計劃中的例子：")+'</b>'+escaped(planned[grade][lang])+'</p></section>';
  }).join("");
  document.getElementById("coverage").innerHTML='<a href="./?lang='+(lang?"zh":"en")+'">← '+t("All quizzes","所有小測")+'</a><h1>'+t("Grade coverage","各年級題目涵蓋範圍")+'</h1><p>'+t("This release candidate lists selectable question families and linked teacher activities. P1 resource-complete checkpoints are recorded separately; new P2 work awaits live verification. Family counts alone do not certify full objective coverage. Planned examples are not live.","本待驗證版本列出可選題目系列及教師活動。小一資源完成記錄另列；小二新增內容仍待網上驗證。系列數量本身不證明已涵蓋所有目標。計劃中的例子尚未上線。")+'</p><p><a href="planning/primary-mathematics.md">'+t("Curriculum and objective map","課程及學習目標對照表")+'</a> · <a href="planning/live-family-audit.md">'+t("Live family audit","已上線題目系列記錄")+'</a> · <a href="planning/full-curriculum-plan.md">'+t("Full 85-unit development plan","85個單元完整開發計劃")+'</a></p>'+cards;
})();
</script></body></html>
