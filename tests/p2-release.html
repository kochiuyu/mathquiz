<!doctype html><html><head><meta charset="utf-8"><title>P2 release regression checks</title></head><body><h1>P2 release checks</h1><p id="summary">Running</p><iframe id="suite" title="Suite" width="1400" height="900"></iframe><script>
(async()=>{const suites=[['p2-angles','p2AnglesResult'],['p2-division','p2DivisionResult'],['p2-change','p2ChangeResult'],['p2-money','p2MoneyResult'],['p2-thousands','p2ThousandsResult'],['p2-pictograms','p2PictogramsResult'],['p2-metres','p2MetresResult'],['p2-facts','p2FactsResult'],['p2-multiply','p2MultiplyResult'],['p2-faces','p2FacesResult'],['p2-arithmetic','p2ArithmeticResult'],['p2-learn','p2LearnResult'],['student','studentResult'],['foundations','foundationsResult'],['learning-map','learningMapResult'],['inquiry','inquiryResult'],['transfer','transferResult']],R=window.releaseResult={done:false,suites:[],reruns:[]},f=document.getElementById('suite');
async function run(name,key,caseName){return new Promise((resolve,reject)=>{let started=false;f.onload=()=>started=true;const timer=setInterval(()=>{const r=started&&f.contentWindow[key];if(r?.done){clearInterval(timer);resolve(JSON.parse(JSON.stringify(r)));}},100);f.src=name+'.html'+(caseName?'?case='+encodeURIComponent(caseName):'');});}
for(const[name,key]of suites){document.getElementById('summary').textContent='Running '+name;const r=await run(name,key);R.suites.push({name,...r});for(const c of r.cases.filter(x=>!x.pass)){const retry=await run(name,key,c.name);R.reruns.push({suite:name,original:c,...retry});}}
R.done=true;document.getElementById('summary').textContent='Done; inspect releaseResult for originals and exact reruns';})();
</script></body></html>
